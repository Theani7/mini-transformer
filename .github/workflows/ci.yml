name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint + test (linux, py3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Sync dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

  train-smoke:
    name: train smoke (macos, mps)
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      - name: Sync dependencies
        run: uv sync --frozen --all-extras --dev

      # The only job that exercises MPS, which is the device every number in the
      # README was measured on. It also downloads the ~2 MB corpus, so the
      # Hugging Face cache is kept between runs.
      #
      # 120 iterations is the smallest count that logs two loss points, and the
      # descent assertion is the point: this job exists to catch a run that
      # completes without learning, which is exactly how the bad weight
      # initialisation (loss 182 instead of 9) presented itself.
      - name: Train 120 steps and assert the loss descends
        run: |
          uv run python -m mini_transformer.train --iters 120 > train.log 2>&1
          cat train.log
          uv run python - <<'PY'
          import re

          text = open("train.log").read()
          losses = [
              float(m)
              for m in re.findall(r"^\s*\d+\s+[0-9.]+s\s+([0-9.]+)\s*$", text, re.M)
          ]
          assert len(losses) >= 2, f"expected two logged losses, parsed {losses}"

          first, last = losses[0], losses[-1]
          print(f"loss {first} -> {last}")
          assert last < first * 0.9, f"loss did not descend: {first} -> {last}"
          PY

      # Output is expected to be degenerate: 120 steps memorises nothing.
      # This job proves the pipeline runs on MPS, not that it learned.
      - name: Generate from the checkpoint it just wrote
        run: uv run python -m mini_transformer.generate --n 40 --temperature 0.0

      - name: Show the device the run actually used
        run: uv run python -c "import torch; print('mps available:', torch.backends.mps.is_available())"