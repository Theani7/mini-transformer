[project]
name = "mini-transformer"
version = "0.2.0"
description = "A BPE-tokenized Transformer language model implemented from scratch in PyTorch."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "theani7", email = "theanilpaneru@gmail.com" }
]
requires-python = ">=3.14"
keywords = [
    "transformer",
    "pytorch",
    "language-model",
    "attention",
    "nlp",
    "education",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Education",
]
dependencies = [
    "datasets>=5",
    "numpy>=2.5.3",
    "tokenizers>=0.23",
    "torch>=2.14.0",
]

[project.urls]
Homepage = "https://github.com/Theani7/mini-transformer"
Repository = "https://github.com/Theani7/mini-transformer"
Issues = "https://github.com/Theani7/mini-transformer/issues"

[project.scripts]
mini-transformer = "mini_transformer.generate:cli"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
