[project]
name = "mini-transformer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "theani7", email = "theanilpaneru@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "torch>=2.14.0",
